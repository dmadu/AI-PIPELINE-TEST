[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "1.0.0"
description = "Flask Backend Service with Python 3.11"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1.0",
    "Werkzeug>=3.1.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"
