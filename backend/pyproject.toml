[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
description = "Flask Backend Application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1.0",
    "python-dotenv>=1.0.1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"
