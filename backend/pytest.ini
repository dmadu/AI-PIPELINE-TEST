[pytest]
; Backend test harness configuration.
; Tests run against the Testing configuration (SQLite in-memory): no
; PostgreSQL instance, Docker container or .env file is required.

; Make the backend package root importable so `import app` works when pytest
; is invoked from the backend/ directory.
pythonpath = .

testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -q --tb=short --strict-markers --disable-warnings

filterwarnings =
    ignore::DeprecationWarning
